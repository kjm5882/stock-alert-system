name: Matching Engine (매칭 엔진)

# 파일럿 단계: 수동 실행. 검증되면 스케줄 추가.
# 주의: 피드 담당자 → 수급 담당자 → 매칭 엔진 순서로 실행해야
#       가장 신선한 데이터로 판단합니다.
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 10 * * 1-5"   # 평일 한국시간 19:00 (UTC 10:00)

jobs:
  run-matching-engine:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install requests

      - name: 매칭 엔진 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/matching_engine.py

      - name: 결과 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "매칭 엔진 실행 결과 업데이트"
          git push
