name: 엔진 자기평가 (주 1회)

# 매칭 엔진의 판정이 실제로 맞았는지 채점한다.
# 매일 돌릴 필요가 없다. 하루 사이에 결론이 바뀌지 않고,
# 종목마다 시세를 받아오므로 호출만 늘어난다.
on:
  schedule:
    - cron: "10 0 * * 6"     # 토요일 09:10 KST — 주간 마감 후
  workflow_dispatch: {}

concurrency:
  group: engine-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 채점
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/engine_eval.py

      - name: 결과 커밋
        if: ${{ always() }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "엔진 자기평가 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push
