name: 관심종목 신규 공시 확인

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  check-disclosures:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 신규 공시 확인 및 알림
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/watchlist_monitor.py

      - name: 상태/캐시 파일 저장
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "actions@github.com"
          git add data/corp_codes.xml data/last_reports.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: 공시 상태 갱신"
          git push || true
