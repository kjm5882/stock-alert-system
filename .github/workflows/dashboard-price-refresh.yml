name: 대시보드 주가 갱신

on:
  schedule:
    # 재무 갱신(23시)과 겹치지 않도록 1시간 전에 실행 (한국시간 오전 7시)
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  price-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 주가 갱신 실행
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python src/dashboard_price_refresh.py

      - name: 결과 커밋
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "actions@github.com"
          git add docs/data/dashboard.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: 대시보드 주가 갱신"
          git push || true
