name: 네이버 API 확인 v4 (임시)

on:
  workflow_dispatch: {}

jobs:
  diagnose-naver4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 네이버 API 후보 테스트
        run: python scripts/diagnose_naver4.py
