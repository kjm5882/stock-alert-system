name: 주간 리포트

# 매일 쌓인 기록을 주 1회 한 장으로 만든다.
# 토요일 09:25 KST (= 00:25 UTC). 엔진 자기평가(09:10)보다 뒤에 둬서
# 그 주 마지막 적재까지 포함되게 한다.
on:
  schedule:
    - cron: "25 0 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 리포트 생성
        run: python scripts/weekly_report.py

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly_report.html
          # 내용이 같으면 커밋하지 않는다 — 빈 커밋이 쌓이면 이력이 지저분해진다.
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "주간 리포트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
