<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반도체 중소형주 대시보드</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #9098a8;
    --accent: #4f8cff;
    --up: #ff5c5c;
    --down: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .updated { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  h2.section {
    font-size: 16px;
    margin: 32px 0 12px;
    padding-left: 10px;
    border-left: 4px solid var(--accent);
  }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  table { border-collapse: collapse; width: 100%; min-width: 1020px; font-size: 13px; }
  thead th {
    background: #1d2129;
    color: var(--muted);
    text-align: right;
    padding: 10px 12px;
    font-weight: 500;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
  }
  thead th:first-child, thead th:nth-child(2) { text-align: left; }
  tbody td {
    padding: 10px 12px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td:first-child { text-align: left; font-weight: 600; }
  tbody td:nth-child(2) {
    text-align: left;
    color: var(--muted);
    font-size: 12px;
    white-space: normal;
    max-width: 240px;
    min-width: 160px;
  }
  tbody tr:hover { background: #1b1f28; }
  .neg { color: var(--up); }
  .pos { color: var(--up); }
  .down { color: var(--down); }
