<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반도체 중소형주 대시보드</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #9098a8;
    --accent: #4f8cff;
    --up: #ff5c5c;
    --down: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .updated { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  h2.section {
    font-size: 16px;
    margin: 32px 0 12px;
    padding-left: 10px;
    border-left: 4px solid var(--accent);
  }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  table { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 13px; }
  thead th {
    background: #1d2129;
    color: var(--muted);
    text-align: right;
    padding: 10px 12px;
    font-weight: 500;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
  }
  thead th:first-child, thead th:nth-child(2) { text-align: left; }
  tbody td {
    padding: 10px 12px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td:first-child { text-align: left; font-weight: 600; }
  tbody td:nth-child(2) {
    text-align: left;
    color: var(--muted);
    font-size: 12px;
    white-space: normal;
    max-width: 260px;
    min-width: 180px;
  }
  tbody tr:hover { background: #1b1f28; }
  .neg { color: var(--up); }
  .muted { color: var(--muted); }
  .footer-note { color: var(--muted); font-size: 12px; margin-top: 24px; line-height: 1.6; }
  .loading { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>
  <h1>📟 반도체 중소형주 대시보드</h1>
  <div class="updated" id="updated">불러오는 중...</div>

  <div id="content">
    <div class="loading">데이터를 불러오는 중입니다...</div>
  </div>

  <div class="footer-note">
    ※ 당기순이익은 지배주주 귀속 기준(가능한 경우), 없으면 총액 폴백<br>
    ※ PER(잠정)은 최근 4개분기(TTM) 지배주주 순이익 기준 직접 계산값입니다.<br>
    ※ PBR은 최신 정기보고서의 자본총계 기준 직접 계산값입니다 (KRX 트레일링 값 아님).<br>
    ※ 업데이트는 각 종목의 정식 분기/반기/사업보고서가 새로 공시될 때 자동 반영됩니다.
  </div>

<script>
const won = (v) => v == null ? "-" : (v / 100000000).toLocaleString("ko-KR", {maximumFractionDigits: 1}) + "억";
const pct = (v) => v == null ? "-" : v.toLocaleString("ko-KR", {maximumFractionDigits: 2}) + "%";
const num = (v, digits=2) => v == null ? "-" : v.toLocaleString("ko-KR", {maximumFractionDigits: digits});
const cls = (v) => (typeof v === "number" && v < 0) ? "neg" : "";

function renderTable(stocks) {
  const rows = stocks.map(s => {
    if (s.error) {
      return `<tr>
        <td>${s.name}<div class="muted" style="font-weight:400;font-size:11px">${s.ticker}</div></td>
        <td>${s.business ?? ""}</td>
        <td colspan="8" class="muted">${s.error}</td>
      </tr>`;
    }
    return `<tr>
      <td>${s.name}<div class="muted" style="font-weight:400;font-size:11px">${s.ticker} · ${s["기준보고서"] ?? ""}</div></td>
      <td>${s.business ?? ""}</td>
      <td class="${cls(s.매출액)}">${won(s.매출액)}</td>
      <td class="${cls(s.영업이익)}">${won(s.영업이익)}</td>
      <td class="${cls(s.당기순이익)}">${won(s.당기순이익)}</td>
      <td>${pct(s.영업이익률)}</td>
      <td>${pct(s.부채비율)}</td>
      <td title="${s.PER_TTM_기준분기 ?? s.PER_비고 ?? ''}">${num(s.PER_TTM)}</td>
      <td>${num(s.PBR)}</td>
      <td>${won(s.시가총액)}</td>
    </tr>`;
  }).join("");

  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>종목</th><th>주요사업</th><th>매출액</th><th>영업이익</th><th>당기순이익</th>
      <th>영업이익률</th><th>부채비율</th><th>PER(잠정,TTM)</th><th>PBR</th><th>시가총액</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

fetch("./data/dashboard.json")
  .then(r => r.json())
  .then(data => {
    document.getElementById("updated").textContent =
      "마지막 업데이트: " + new Date(data.updated_at).toLocaleString("ko-KR");

    const stocks = data.stocks || [];
    const jeon = stocks.filter(s => s.category === "전공정");
    const hu = stocks.filter(s => s.category === "후공정");

    let html = "";
    html += `<h2 class="section">전공정 (${jeon.length})</h2>` + renderTable(jeon);
    html += `<h2 class="section">후공정 (${hu.length})</h2>` + renderTable(hu);

    document.getElementById("content").innerHTML = html;
  })
  .catch(err => {
    document.getElementById("content").innerHTML =
      `<div class="loading">데이터 로딩 실패: ${err}<br>data/dashboard.json 파일이 아직 생성되지 않았을 수 있습니다.</div>`;
  });
</script>
</body>
</html>
